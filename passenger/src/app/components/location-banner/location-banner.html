<div
  class="absolute top-4 left-4 right-4 z-10 flex items-center justify-between pointer-events-none"
>
  <div
    class="bg-white/95 backdrop-blur-md px-4 py-2.5 rounded-2xl shadow-lg border border-slate-200/80 flex items-center gap-3 pointer-events-auto"
  >
    <img
      src="/images/adust-logo.png"
      alt="ADUST Logo"
      class="w-7 h-7 object-contain"
      width="28"
      height="28"
    />
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-blue-600 animate-pulse"></span>
      <span class="text-xs sm:text-sm font-bold text-slate-900">Road 6C, Sector 12</span>
    </div>
    <span class="text-[10px] bg-slate-100 text-slate-600 font-semibold px-2 py-0.5 rounded-md ml-2"
      >Demo</span
    >
  </div>
  <button
    type="button"
    (click)="recenterRequested.emit()"
    class="bg-white/95 backdrop-blur-md p-3 rounded-2xl shadow-lg border border-slate-200/80 text-blue-600 pointer-events-auto hover:bg-slate-50 transition-colors"
    aria-label="Recenter map"
  >
    📍
  </button>
</div>
