<aside
  class="absolute left-0 top-0 bottom-0 z-20 flex flex-col w-full sm:w-80 h-full bg-white/95 lg:bg-slate-50/95 backdrop-blur-2xl border-r border-slate-200/80 shadow-2xl p-5 transition-transform duration-500 ease-in-out translate-x-0"
  aria-label="Nearby Bus Routes Sidebar"
>
  <div class="flex items-center justify-between mb-5 pb-4 border-b border-slate-200">
    <div class="flex items-center gap-3">
      <img
        src="/images/adust-logo.png"
        alt="ADUST Logo"
        class="w-11 h-11 rounded-full shadow-md object-cover bg-slate-900"
        width="44"
        height="44"
      />
      <div>
        <h2 class="text-sm font-bold text-slate-900 leading-tight">ADUST Transport</h2>
        <p class="text-[11px] text-slate-500 font-medium">Atish Dipankar University</p>
      </div>
    </div>
    <button
      type="button"
      (click)="settingsRequested.emit()"
      class="p-1.5 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-200 transition-colors"
      title="Settings"
    >
      ⚙️
    </button>
  </div>
  <div
    class="p-3.5 rounded-xl bg-white border border-slate-200/80 shadow-xs mb-5 flex items-center gap-3"
  >
    <div class="w-3 h-3 rounded-full bg-blue-600 shadow-sm shrink-0"></div>
    <div>
      <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Your location</p>
      <p class="text-xs font-bold text-slate-900">Road 6C, Sector 12</p>
    </div>
  </div>
  <div class="flex items-center justify-between mb-3">
    <h3 class="text-xs font-bold text-slate-900">Nearby buses</h3>
    <span class="text-xs text-slate-500 font-medium">Closest first ▾</span>
  </div>
  <div class="space-y-2.5 flex-1 overflow-y-auto pr-1" aria-label="Nearby buses list">
    @for (bus of buses; track bus.id) {
      <div
        (click)="busSelected.emit(bus)"
        class="p-3.5 rounded-xl bg-white border transition-all cursor-pointer shadow-xs hover:border-blue-400"
        [class.border-blue-600]="selectedBus?.id === bus.id"
        [class.ring-2]="selectedBus?.id === bus.id"
        [class.ring-blue-600/20]="selectedBus?.id === bus.id"
        [class.border-slate-200]="selectedBus?.id !== bus.id"
      >
        <div class="flex items-center justify-between mb-1">
          <div class="flex items-center gap-2">
            <span class="text-xs font-extrabold text-white bg-slate-900 px-2 py-0.5 rounded">{{
              bus.id
            }}</span
            ><span class="text-xs font-bold text-slate-900">{{ bus.name }}</span>
          </div>
          <span class="text-xs font-bold text-slate-900">{{ bus.distance }}</span>
        </div>
        <p class="text-[11px] text-slate-500 truncate mb-2">{{ bus.route }}</p>
        <div
          class="flex items-center justify-between text-[10px] text-slate-500 pt-2 border-t border-slate-100"
        >
          <span class="flex items-center gap-1 font-medium text-emerald-600"
            ><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>{{ bus.status }} ·
            {{ bus.statusText }}</span
          ><span>🪑 {{ bus.seats }} seats</span>
        </div>
      </div>
    }
  </div>
</aside>
